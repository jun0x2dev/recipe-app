spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/recipe_app
    username: recipe_user
    password: recipe_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: change-me-local-development-secret-key-must-be-at-least-256-bits
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

oauth:
  naver:
    profile-uri: https://openapi.naver.com/v1/nid/me
