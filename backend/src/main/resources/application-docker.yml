spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${DB_NAME:recipe_app}
    username: ${DB_USERNAME:recipe_user}
    password: ${DB_PASSWORD:recipe_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000
