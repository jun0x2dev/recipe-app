services:
  postgres:
    image: postgres:16-alpine
    container_name: recipe-app-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-recipe_app}
      POSTGRES_USER: ${DB_USERNAME:-recipe_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-recipe_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: recipe-app-backend
    restart: unless-stopped
    ports:
      - "8089:8089"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AI_WORKER_BASE_URL=http://ai-worker:8001
      - DB_NAME=${DB_NAME:-recipe_app}
      - DB_USERNAME=${DB_USERNAME:-recipe_user}
      - DB_PASSWORD=${DB_PASSWORD:-recipe_pass}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  ai-worker:
    build:
      context: ../ai-worker
      dockerfile: Dockerfile
    container_name: recipe-app-ai-worker
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # Ollama는 호스트(Windows)에서 실행된다. host.docker.internal로 접근한다.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      # WSL2(Linux) 환경에서 host.docker.internal이 자동 등록되지 않는 문제를 해결한다.
      - "host.docker.internal:host-gateway"
    volumes:
      - whisper_cache:/root/.cache/huggingface

volumes:
  postgres_data:
  whisper_cache:
