services:
  postgres:
    image: postgres:16-alpine
    container_name: recipe-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: recipe_app
      POSTGRES_USER: recipe_user
      POSTGRES_PASSWORD: recipe_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe_user -d recipe_app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
